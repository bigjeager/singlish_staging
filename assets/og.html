<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@500;700&display=swap">
<style>
html,body{margin:0}
body{width:1200px;height:630px;overflow:hidden;background:#0B0A14;color:#F7F5FF;font-family:Figtree,"PingFang SC",sans-serif;position:relative}
.glow{position:absolute;inset:-30%;background:radial-gradient(40% 50% at 25% 35%,rgba(255,77,141,.55),transparent 70%),radial-gradient(35% 45% at 80% 70%,rgba(255,181,71,.4),transparent 70%);filter:blur(40px)}
.wrap{position:relative;padding:86px 90px;display:flex;flex-direction:column;gap:26px;height:100%;box-sizing:border-box}
.logo{display:flex;align-items:center;gap:22px}
.eq{display:flex;gap:9px;align-items:flex-end;height:74px}.eq i{width:14px;border-radius:7px;background:linear-gradient(#FF4D8D,#FFB547)}
h1{margin:0;font:800 132px/1 "Bricolage Grotesque",sans-serif;letter-spacing:-.045em}
h1 span{background:linear-gradient(95deg,#FF4D8D,#FF7A59 55%,#FFB547);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0;font-size:38px;font-weight:700;color:#E4E1F5}
.words{margin-top:auto;display:flex;gap:14px;flex-wrap:wrap}
.w{font:800 30px "Bricolage Grotesque",sans-serif;padding:6px 18px;border-radius:14px 10px 16px 11px;transform:skew(-7deg) rotate(-1.2deg)}
.y{background:#FFE14A;color:#1D1426}.r{background:#FF4D8D;color:#fff}.g{background:rgba(255,255,255,.1);color:#D4D0EC}
</style></head><body><div class="glow"></div><div class="wrap">
<div class="logo"><div class="eq"><i style="height:40%"></i><i style="height:90%"></i><i style="height:60%"></i><i style="height:100%"></i></div><h1>Sing<span>lish</span></h1></div>
<p>听歌记单词 · 每个雅思词都藏在一段流行歌里</p>
<div class="words"><span class="w y">apology</span><span class="w r">mercy</span><span class="w g">blind</span><span class="w y">worship</span><span class="w g">breathless</span></div>
</div></body></html>
